name: Release Build & Installer

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup MinGW
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64

      - name: Create Build Directory
        run: mkdir -p build/bin

      - name: Compile antx (CLI/Installer logic)
        run: g++ -std=c++17 -O3 -static -static-libgcc -static-libstdc++ src/cli/main.cpp -o build/bin/antx.exe -Isrc/common -lbcrypt -ladvapi32 -lshell32

      - name: Compile antx_service
        run: g++ -std=c++17 -O3 -static -static-libgcc -static-libstdc++ src/service/service.cpp -o build/bin/antx_service.exe -Isrc/common -ladvapi32

      - name: Compile antx_monitor
        run: g++ -std=c++17 -O3 -static -static-libgcc -static-libstdc++ src/monitor/monitor.cpp src/monitor/updater.cpp -o build/bin/antx_monitor.exe -Isrc/common -lws2_32 -luser32 -ladvapi32 -lpsapi -lshell32 -lwininet -mwindows

      - name: Compile Inno Setup Installer
        run: |
          # The windows-latest runner comes with Inno Setup pre-installed at this path
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Release to GitHub
        uses: softprops/action-gh-release@v1
        with:
          files: Output/Antx_Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
